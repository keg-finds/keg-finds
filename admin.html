<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KEG Finds — Seller Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-stone-100 text-stone-800 min-h-screen">

  <header class="bg-stone-900 text-white py-4 px-6 sticky top-0 z-30 shadow-sm flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="w-8 h-8 rounded-lg bg-emerald-600 text-white font-bold flex items-center justify-center text-sm">K</span>
      <div>
        <h1 class="font-bold text-sm leading-tight">KEG Finds — Seller Dashboard</h1>
        <p class="text-[11px] text-stone-400">Order verification &amp; 1-click stock deduction</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="logoutAdmin()" id="logout-btn" class="hidden text-xs text-stone-400 hover:text-white px-2 py-1">Log out</button>
      <a href="index.html" class="text-xs bg-stone-800 hover:bg-stone-700 text-stone-300 px-3 py-1.5 rounded-lg">View Storefront &rarr;</a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 md:p-6">

    <div id="login-card" class="max-w-sm mx-auto mt-16 bg-white p-8 rounded-2xl border border-stone-200 shadow-sm text-center">
      <div class="w-12 h-12 rounded-full bg-stone-100 text-stone-700 flex items-center justify-center mx-auto mb-4">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
      </div>
      <h2 class="font-bold text-lg text-stone-900">Seller Verification</h2>
      <p class="text-xs text-stone-500 mt-1">Enter your admin PIN to manage orders.</p>

      <div class="mt-6">
        <input type="password" id="admin-pin-input" placeholder="Enter PIN (e.g. 1234)" class="w-full text-center text-lg tracking-widest font-mono border border-stone-300 rounded-xl py-3 px-4 focus:ring-2 focus:ring-stone-900 outline-none">
        <button onclick="loginAdmin()" class="w-full mt-3 bg-stone-900 hover:bg-black text-white font-bold text-xs uppercase tracking-wider py-3 rounded-xl transition">
          Unlock Dashboard
        </button>
      </div>
    </div>

    <div id="dashboard-content" class="hidden">
      <div class="flex items-center justify-between mb-6">
        <div>
          <h2 class="font-extrabold text-xl text-stone-900">Incoming Orders</h2>
          <p class="text-xs text-stone-500">Verify customer GCash/Maya transfer before clicking confirm.</p>
        </div>
        <button onclick="loadOrders()" class="bg-white border border-stone-200 hover:bg-stone-50 text-stone-700 text-xs font-bold px-3.5 py-2 rounded-xl flex items-center gap-1.5 shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          <span>Refresh</span>
        </button>
      </div>

      <div id="orders-container" class="space-y-4">
        <div class="text-center py-12 text-stone-400 text-sm">Loading orders...</div>
      </div>
    </div>

  </main>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwXrszc-8L5P1ZRcIHKD3OmJEyq4EZIwqx0cvUs4vYlaBJzZo6ilWh_KaRKrNEBJvmr/exec";

    let savedPin = localStorage.getItem("keg_admin_pin") || "";

    function loginAdmin() {
      const pin = document.getElementById("admin-pin-input").value.trim();
      if (!pin) {
        alert("Please enter your PIN.");
        return;
      }
      savedPin = pin;
      localStorage.setItem("keg_admin_pin", pin);
      loadOrders();
    }

    function logoutAdmin() {
      localStorage.removeItem("keg_admin_pin");
      savedPin = "";
      location.reload();
    }

    async function loadOrders() {
      document.getElementById("login-card").classList.add("hidden");
      document.getElementById("dashboard-content").classList.remove("hidden");
      document.getElementById("logout-btn").classList.remove("hidden");

      const container = document.getElementById("orders-container");
      container.innerHTML = '<div class="text-center py-12 text-stone-400 text-sm">Fetching orders from Google Sheets...</div>';

      try {
        const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getOrders&pin=${encodeURIComponent(savedPin)}`);
        const data = await res.json();

        if (data.status === "error") {
          alert("Incorrect PIN! Access denied.");
          logoutAdmin();
          return;
        }

        renderOrders(data);
      } catch (err) {
        console.error(err);
        container.innerHTML = '<div class="text-center py-12 text-red-600 text-sm">Failed to connect to Google Sheets. Check script deployment.</div>';
      }
    }

    function renderOrders(orders) {
      const container = document.getElementById("orders-container");

      if (!orders || orders.length === 0) {
        container.innerHTML = '<div class="bg-white p-8 rounded-2xl border border-stone-200 text-center text-stone-400 text-sm">No orders yet.</div>';
        return;
      }

      container.innerHTML = orders.map(order => {
        const isConfirmed = order.status === "CONFIRMED";
        const isExpired = order.status === "EXPIRED_CANCELLED";

        let parsedItems = [];
        try {
          parsedItems = JSON.parse(order.itemsJson);
        } catch (e) {
          parsedItems = [{ id: "-", name: order.itemsJson, qty: 1, price: order.total }];
        }

        let badgeHtml = '';
        if (isConfirmed) {
          badgeHtml = '<span class="px-2.5 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-wider bg-emerald-100 text-emerald-800">✔ Paid &amp; Confirmed</span>';
        } else if (isExpired) {
          badgeHtml = '<span class="px-2.5 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-wider bg-stone-200 text-stone-600">⏱️ Expired &bull; Stock Returned</span>';
        } else {
          badgeHtml = '<span class="px-2.5 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-wider bg-amber-100 text-amber-800 animate-pulse">⏳ 2-Hr Hold (Pending)</span>';
        }

        return `
          <div class="bg-white rounded-2xl border ${isExpired ? 'border-stone-200 opacity-60' : isConfirmed ? 'border-stone-200 bg-stone-50/50' : 'border-amber-200 ring-1 ring-amber-100'} p-5 shadow-sm">
            
            <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-stone-100 text-xs">
              <div class="flex items-center gap-2">
                <span class="font-mono font-bold text-stone-900">${order.orderId}</span>
                <span class="text-stone-400">&bull;</span>
                <span class="text-stone-500">${order.date}</span>
              </div>
              ${badgeHtml}
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 my-4">
              <div>
                <h4 class="text-[10px] uppercase font-bold tracking-wider text-stone-400 mb-1">Purchased Items</h4>
                <div class="space-y-1.5">
                  ${parsedItems.map(item => `
                    <div class="text-xs font-semibold text-stone-800 flex items-center justify-between bg-stone-50 p-2 rounded-lg border border-stone-100">
                      <div class="flex items-center gap-2">
                        <span class="bg-stone-900 text-white font-mono text-[10px] font-bold px-1.5 py-0.5 rounded">ID #${item.id || '-'}</span>
                        <span>${item.name}</span>
                      </div>
                      <span class="text-stone-500 font-mono font-bold">${item.qty}x</span>
                    </div>
                  `).join('')}
                </div>
                <div class="mt-3 text-sm font-extrabold text-stone-900">
                  Total: ₱${Number(order.total).toLocaleString()}
                </div>
              </div>

              <div class="text-xs space-y-1 bg-stone-50 p-3 rounded-xl border border-stone-100">
                <h4 class="text-[10px] uppercase font-bold tracking-wider text-stone-400 mb-1">Buyer Details</h4>
                <div><span class="text-stone-500">Name:</span> <strong class="text-stone-800">${order.buyerName}</strong></div>
                <div><span class="text-stone-500">Email:</span> <strong class="text-stone-800">${order.buyerEmail || 'None'}</strong></div>
                <div><span class="text-stone-500">Contact:</span> <strong class="text-stone-800 font-mono">${order.buyerContact}</strong></div>
                <div><span class="text-stone-500">Method:</span> <strong class="text-stone-800">${order.paymentMethod}</strong></div>
                <div><span class="text-stone-500">Fulfillment:</span> <span class="text-stone-700">${order.fulfillment}</span></div>
              </div>
            </div>

            <div class="pt-3 border-t border-stone-100 flex justify-end">
              ${isConfirmed ? `
                <span class="text-xs text-stone-400 font-semibold italic">Stock confirmed &amp; receipt sent</span>
              ` : isExpired ? `
                <span class="text-xs text-stone-400 font-semibold italic">Unpaid after 2 hours — stock returned to shop</span>
              ` : `
                <button onclick="confirmOrder('${order.orderId}')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow-sm transition flex items-center gap-1.5">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                  <span>Confirm Payment &amp; Mark Sold</span>
                </button>
              `}
            </div>

          </div>
        `;
      }).join('');
    }

    async function confirmOrder(orderId) {
      const ok = confirm(`Did you check your GCash/Maya app and verify the money arrived for Order ${orderId}?`);
      if (!ok) return;

      try {
        const res = await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action: "confirmPayment",
            pin: savedPin,
            orderId: orderId
          })
        });
        const result = await res.json();

        if (result.status === "success") {
          alert(`Order ${orderId} confirmed! Marked officially sold.`);
          loadOrders();
        } else {
          alert(`Error: ${result.message}`);
        }
      } catch (err) {
        console.error(err);
        alert("Failed to confirm order. Please try again.");
      }
    }

    if (savedPin) {
      loadOrders();
    }
  </script>
</body>
</html>
